<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- upscale: a coarse 2x2 block on the left becoming a fine 4x4 grid on the
       right. At 16px that reads as "few big pixels -> many small ones", which
       is what the tool does, rather than a generic arrow. -->
  <rect width="32" height="32" rx="7" fill="#0f1115"/>

  <!-- source: four chunky pixels -->
  <g fill="#3b82f6">
    <rect x="4"  y="9"  width="5" height="5" rx="1"/>
    <rect x="10" y="9"  width="5" height="5" rx="1" opacity=".55"/>
    <rect x="4"  y="15" width="5" height="5" rx="1" opacity=".55"/>
    <rect x="10" y="15" width="5" height="5" rx="1" opacity=".28"/>
  </g>

  <!-- result: the same area at twice the resolution -->
  <g fill="#6ee7a0">
    <rect x="18"   y="8"    width="2.6" height="2.6" rx=".6"/>
    <rect x="21.4" y="8"    width="2.6" height="2.6" rx=".6" opacity=".8"/>
    <rect x="24.8" y="8"    width="2.6" height="2.6" rx=".6" opacity=".6"/>
    <rect x="18"   y="11.4" width="2.6" height="2.6" rx=".6" opacity=".8"/>
    <rect x="21.4" y="11.4" width="2.6" height="2.6" rx=".6" opacity=".6"/>
    <rect x="24.8" y="11.4" width="2.6" height="2.6" rx=".6" opacity=".45"/>
    <rect x="18"   y="14.8" width="2.6" height="2.6" rx=".6" opacity=".6"/>
    <rect x="21.4" y="14.8" width="2.6" height="2.6" rx=".6" opacity=".45"/>
    <rect x="24.8" y="14.8" width="2.6" height="2.6" rx=".6" opacity=".3"/>
    <rect x="18"   y="18.2" width="2.6" height="2.6" rx=".6" opacity=".45"/>
    <rect x="21.4" y="18.2" width="2.6" height="2.6" rx=".6" opacity=".3"/>
    <rect x="24.8" y="18.2" width="2.6" height="2.6" rx=".6" opacity=".2"/>
  </g>

  <text x="16" y="28.5" font-family="ui-sans-serif,system-ui,sans-serif" font-size="7"
        font-weight="700" fill="#8b93a7" text-anchor="middle">2×</text>
</svg>
